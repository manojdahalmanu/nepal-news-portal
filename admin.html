<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Nepal News Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="admin-header">
    <div>
      <strong>Nepal News Portal</strong>
      <span>Admin Panel</span>
    </div>
    <div class="header-actions">
      <a href="index.html" target="_blank">View Website</a>
      <button id="logoutBtn" hidden>Logout</button>
    </div>
  </header>

  <main class="admin-wrap">
    <section id="loginCard" class="auth-card">
      <h1>Admin Login</h1>
      <p>Supabase मा बनाएको admin email/password प्रयोग गर्नुहोस्।</p>
      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="admin@example.com">
      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="••••••••">
      <button id="loginBtn" class="primary">Login</button>
      <div id="loginMsg" class="msg"></div>
    </section>

    <section id="dashboard" hidden>
      <div class="dashboard-grid">
        <div class="editor-card">
          <div class="card-title">
            <h2 id="formTitle">नयाँ समाचार प्रकाशित गर्नुहोस्</h2>
            <button id="resetBtn" class="secondary">New</button>
          </div>

          <input type="hidden" id="newsId">

          <label>समाचार शीर्षक *</label>
          <input id="title" placeholder="समाचारको शीर्षक">

          <div class="two-col">
            <div>
              <label>Category *</label>
              <select id="category">
                <option>राजनीति</option>
                <option>अर्थतन्त्र</option>
                <option>समाज</option>
                <option>खेलकुद</option>
                <option>विश्व</option>
                <option>प्रविधि</option>
                <option>शिक्षा</option>
                <option>मनोरञ्जन</option>
              </select>
            </div>
            <div>
              <label>Status</label>
              <select id="published">
                <option value="true">Published</option>
                <option value="false">Draft</option>
              </select>
            </div>
          </div>

          <label>छोटो सारांश</label>
          <textarea id="summary" rows="3" placeholder="Homepage मा देखिने छोटो विवरण"></textarea>

          <label>पूरा समाचार</label>
          <textarea id="content" rows="9" placeholder="पूरा समाचार सामग्री"></textarea>

          <label>Featured Image</label>
          <input id="imageFile" type="file" accept="image/*">
          <div id="imagePreview"></div>

          <button id="saveBtn" class="primary">Publish / Save</button>
          <div id="saveMsg" class="msg"></div>
        </div>

        <div class="list-card">
          <div class="card-title">
            <h2>समाचार सूची</h2>
            <button id="refreshBtn" class="secondary">Refresh</button>
          </div>
          <div id="newsTable"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
